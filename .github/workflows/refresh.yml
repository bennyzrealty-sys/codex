name: refresh-codex
on:
  schedule:
    - cron: "0 6 */2 * *"     # 06:00 UTC every 2 days
  workflow_dispatch: {}        # manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run caretaker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_codex.py
      - name: Commit if changed
        run: |
          git config user.name  "codex-caretaker"
          git config user.email "caretaker@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "refresh: frontier + changelog ($(date -u +%F))"
          git push
