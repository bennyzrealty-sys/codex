name: refresh-codex
on:
  schedule:
    - cron: "0 6 */2 * *"     # 06:00 UTC every 2 days
  workflow_dispatch: {}        # manual "Run workflow" button
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run caretaker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_codex.py
      - name: Re-tag any new cards       # Layer 04 is rewritten without ids
        run: python scripts/tag_cards.py
      - name: Stamp figure sizes         # keeps deep links landing where they should
        run: python scripts/size_figures.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "codex-caretaker"
          git config user.email "caretaker@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "refresh: frontier + changelog ($(date -u +%F))"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy site   # GITHUB_TOKEN pushes don't trigger push workflows
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
