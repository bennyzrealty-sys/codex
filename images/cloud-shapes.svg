<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THREE DEPTHS OF RENTED COMPUTER — AND WHO IS LEFT HOLDING IT</text>
  <rect x="30" y="78" width="216" height="150" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="138" y="110" fill="#dfa32b" fill-opacity="1" font-size="17" text-anchor="middle" font-weight="600">IaaS</text>
  <text x="138" y="136" fill="#e7e2d4" fill-opacity="1" font-size="12.5" text-anchor="middle" font-weight="400">a bare machine</text>
  <line x1="60" y1="152" x2="216" y2="152" stroke="#dfa32b" stroke-opacity=".3" stroke-width="1"/>
  <text x="138" y="176" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">you patch the OS,</text>
  <text x="138" y="193" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">the runtime, the app</text>
  <rect x="266" y="78" width="216" height="150" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="374" y="110" fill="#57b39c" fill-opacity="1" font-size="17" text-anchor="middle" font-weight="600">PaaS</text>
  <text x="374" y="136" fill="#e7e2d4" fill-opacity="1" font-size="12.5" text-anchor="middle" font-weight="400">a place to put code</text>
  <line x1="296" y1="152" x2="452" y2="152" stroke="#57b39c" stroke-opacity=".3" stroke-width="1"/>
  <text x="374" y="176" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">they patch below,</text>
  <text x="374" y="193" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">you own the app</text>
  <rect x="502" y="78" width="216" height="150" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="610" y="110" fill="#9fb4d8" fill-opacity="1" font-size="17" text-anchor="middle" font-weight="600">SaaS</text>
  <text x="610" y="136" fill="#e7e2d4" fill-opacity="1" font-size="12.5" text-anchor="middle" font-weight="400">finished software</text>
  <line x1="532" y1="152" x2="688" y2="152" stroke="#9fb4d8" stroke-opacity=".3" stroke-width="1"/>
  <text x="610" y="176" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">you own the config</text>
  <text x="610" y="193" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">and the data only</text>
  <text x="30" y="256" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the shared responsibility line moves — the liability does not</text>
  <rect x="30" y="272" width="700" height="56" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="296" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Whatever the provider secures, your data, your access control and your</text>
  <text x="48" y="314" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">misconfiguration remain yours. Almost every cloud breach is that last one.</text>
  <rect x="30" y="342" width="700" height="58" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="366" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the three bills that surprise people</text>
  <text x="48" y="388" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">egress per gigabyte · an idle thing nobody turned off · logs charged by volume</text>
</svg>
