<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">HOW INTRUSIONS ACTUALLY GO — AND WHERE THE CHEAP STOPS ARE</text>
  <rect x="30" y="82" width="124" height="60" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="92" y="109" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">get in</text>
  <text x="92" y="127" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">phished password</text>
  <line x1="154" y1="112" x2="168" y2="112" stroke="#cf6f57" stroke-opacity=".7" stroke-width="1.6"/>
  <polygon points="168,112 161.608,114.854 161.608,109.146" fill="#cf6f57" fill-opacity=".7"/>
  <rect x="168" y="82" width="124" height="60" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="230" y="109" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">hold on</text>
  <text x="230" y="127" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">a scheduled task</text>
  <line x1="292" y1="112" x2="306" y2="112" stroke="#cf6f57" stroke-opacity=".7" stroke-width="1.6"/>
  <polygon points="306,112 299.608,114.854 299.608,109.146" fill="#cf6f57" fill-opacity=".7"/>
  <rect x="306" y="82" width="124" height="60" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="368" y="109" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">look around</text>
  <text x="368" y="127" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">who else can I be?</text>
  <line x1="430" y1="112" x2="444" y2="112" stroke="#dfa32b" stroke-opacity=".7" stroke-width="1.6"/>
  <polygon points="444,112 437.608,114.854 437.608,109.146" fill="#dfa32b" fill-opacity=".7"/>
  <rect x="444" y="82" width="124" height="60" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="506" y="109" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">move sideways</text>
  <text x="506" y="127" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">flat network</text>
  <line x1="568" y1="112" x2="582" y2="112" stroke="#dfa32b" stroke-opacity=".7" stroke-width="1.6"/>
  <polygon points="582,112 575.608,114.854 575.608,109.146" fill="#dfa32b" fill-opacity=".7"/>
  <rect x="582" y="82" width="124" height="60" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="644" y="109" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">take / break</text>
  <text x="644" y="127" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">exfil, then encrypt</text>
  <line x1="92" y1="142" x2="92" y2="176" stroke="#57b39c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="53" y="178" width="78" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="92" y="194" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">passkeys</text>
  <line x1="230" y1="142" x2="230" y2="176" stroke="#57b39c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="184" y="178" width="92" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="230" y="194" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">EDR + logs</text>
  <line x1="368" y1="142" x2="368" y2="176" stroke="#57b39c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="304.5" y="178" width="127" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="368" y="194" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">least privilege</text>
  <line x1="506" y1="142" x2="506" y2="176" stroke="#57b39c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="453" y="178" width="106" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="506" y="194" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">segmentation</text>
  <line x1="644" y1="142" x2="644" y2="176" stroke="#57b39c" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 5"/>
  <rect x="580.5" y="178" width="127" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="644" y="194" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">offline backups</text>
  <text x="30" y="244" fill="#dfa32b" fill-opacity="1" font-size="14" text-anchor="start" font-weight="600">the shape of the lesson</text>
  <text x="30" y="270" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">None of these five steps is clever. Four of the five are stopped by things</text>
  <text x="30" y="290" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">that cost nothing: a passkey, a non-admin account, a flat network broken in</text>
  <text x="30" y="310" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">two, and a backup the attacker cannot reach. Sophistication is rarely the story.</text>
  <rect x="30" y="332" width="700" height="62" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="358" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">dwell time — how long they sit inside before anyone notices — is measured</text>
  <text x="48" y="377" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">in days now, not months. Detection has improved; the front door has not.</text>
</svg>
