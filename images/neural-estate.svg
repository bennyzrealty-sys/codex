<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">YOUR REPOS AS ONE ORGANISM — THE VOCABULARY, MAPPED</text>
  <circle cx="96" cy="108" r="26" fill="#1a2330" stroke="#57b39c" stroke-opacity=".8"/>
  <text x="96" y="154" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">bennyz</text>
  <circle cx="222" cy="92" r="26" fill="#1a2330" stroke="#57b39c" stroke-opacity=".8"/>
  <text x="222" y="138" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">shift-watcher</text>
  <circle cx="96" cy="200" r="26" fill="#1a2330" stroke="#57b39c" stroke-opacity=".8"/>
  <text x="96" y="246" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">thiri</text>
  <circle cx="232" cy="196" r="26" fill="#1a2330" stroke="#57b39c" stroke-opacity=".8"/>
  <text x="232" y="242" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">second-brain</text>
  <line x1="96" y1="108" x2="178" y2="288" stroke="#57b39c" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="222" y1="92" x2="178" y2="288" stroke="#57b39c" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="96" y1="200" x2="178" y2="288" stroke="#57b39c" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="232" y1="196" x2="178" y2="288" stroke="#57b39c" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="108" y="268" width="140" height="46" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="178" y="288" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">the Pi</text>
  <text x="178" y="306" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">always on</text>
  <text x="178" y="340" fill="#dfa32b" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">brainstem · reflexes</text>
  <text x="178" y="362" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">£366 · ~10 watts</text>
  <text x="360" y="78" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">the metaphor, and the engineering underneath it</text>
  <text x="360" y="106" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">neuron</text>
  <text x="452" y="106" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">a repo</text>
  <text x="360" y="136" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">firing</text>
  <text x="452" y="136" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">an event it emits</text>
  <text x="360" y="166" fill="#9fb4d8" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">axon</text>
  <text x="452" y="166" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">webhook / repository_dispatch</text>
  <text x="360" y="196" fill="#dfa32b" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">brainstem</text>
  <text x="452" y="196" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">the Pi — always on, runs the reflexes</text>
  <text x="360" y="226" fill="#9fb4d8" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">connectome</text>
  <text x="452" y="226" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">the shared vector store, where traces live</text>
  <text x="360" y="256" fill="#cf6f57" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">sleep</text>
  <text x="452" y="256" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">the nightly job that consolidates the day</text>
  <text x="360" y="300" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">engineering name: event-driven architecture</text>
  <text x="360" y="320" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">with choreography — standard practice.</text>
  <rect x="30" y="356" width="700" height="48" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="380" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">v0.1 is one synapse: shift-watcher fires → second-brain logs it → Telegram tells you.</text>
  <text x="48" y="398" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Build one synapse before dreaming the whole brain. That is also how brains did it.</text>
</svg>
