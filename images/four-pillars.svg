<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE FOUR FLOORS BENEATH THE MAP — TWO TO STUDY, TWO TO BUILD</text>
  <rect x="30" y="76" width="166" height="196" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="44" y="104" fill="#57b39c" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">Pillar 1</text>
  <text x="44" y="130" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">the network floor</text>
  <text x="44" y="178" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">JA3/JA4 — the handshake</text>
  <text x="44" y="195" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">tell, one floor below</text>
  <text x="44" y="212" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">the headers you edit</text>
  <rect x="44" y="234" width="74" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="81" y="250" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">study</text>
  <rect x="208" y="76" width="166" height="196" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="222" y="104" fill="#9fb4d8" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">Pillar 2</text>
  <text x="222" y="130" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">the IP layer</text>
  <text x="222" y="178" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">datacentre vs residential</text>
  <text x="222" y="195" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">vs mobile — and why</text>
  <text x="222" y="212" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">reputation collapses</text>
  <rect x="222" y="234" width="74" height="24" rx="12" fill="none" stroke="#9fb4d8" stroke-opacity=".6"/>
  <text x="259" y="250" fill="#9fb4d8" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">study</text>
  <rect x="386" y="76" width="166" height="196" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="400" y="104" fill="#dfa32b" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">Pillar 3</text>
  <text x="400" y="130" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">searchable memory</text>
  <text x="400" y="178" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">a vector store on the</text>
  <text x="400" y="195" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">SSD: facts you own,</text>
  <text x="400" y="212" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">retrieved by meaning</text>
  <rect x="400" y="234" width="74" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="437" y="250" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">build</text>
  <rect x="564" y="76" width="166" height="196" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="578" y="104" fill="#cf6f57" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">Pillar 4</text>
  <text x="578" y="130" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">the right</text>
  <text x="578" y="147" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">always-on</text>
  <text x="578" y="178" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">not serverless, not a</text>
  <text x="578" y="195" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">laptop — a box with no</text>
  <text x="578" y="212" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">timeout, no cold start</text>
  <rect x="578" y="234" width="74" height="24" rx="12" fill="none" stroke="#cf6f57" stroke-opacity=".6"/>
  <text x="615" y="250" fill="#cf6f57" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">build</text>
  <rect x="30" y="292" width="700" height="52" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="316" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Pillars 1 and 2 you study so you can read a defence honestly — and so you never mistake</text>
  <text x="48" y="334" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">a spoofed header for anonymity. Pillars 3 and 4 you build; both are already in your hands.</text>
  <rect x="30" y="356" width="700" height="46" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="384" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the 10-second wall is why: serverless dies mid-job, the edge forgets, the Pi just keeps going.</text>
</svg>
