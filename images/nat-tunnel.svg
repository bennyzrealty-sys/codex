<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">WHY YOUR HOME SERVER IS UNREACHABLE — AND THE HONEST WAY IN</text>
  <text x="30" y="76" fill="#cf6f57" fill-opacity="1" font-size="14" text-anchor="start" font-weight="600">the old way: punch a hole</text>
  <rect x="30" y="96" width="120" height="54" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="90" y="128" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">internet</text>
  <line x1="150" y1="123" x2="205" y2="123" stroke="#cf6f57" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="205,123 198.608,125.854 198.608,120.146" fill="#cf6f57" fill-opacity=".8"/>
  <rect x="205" y="96" width="130" height="54" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="270" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">router / NAT</text>
  <text x="270" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">port 22 open</text>
  <line x1="335" y1="123" x2="390" y2="123" stroke="#cf6f57" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="390,123 383.608,125.854 383.608,120.146" fill="#cf6f57" fill-opacity=".8"/>
  <rect x="390" y="96" width="120" height="54" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="450" y="128" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">your Pi</text>
  <text x="530" y="112" fill="#cf6f57" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">every scanner on earth</text>
  <text x="530" y="130" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">finds that hole in</text>
  <text x="530" y="148" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">under an hour</text>
  <text x="30" y="208" fill="#57b39c" fill-opacity="1" font-size="14" text-anchor="start" font-weight="600">the modern way: no hole at all</text>
  <rect x="30" y="228" width="120" height="54" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="90" y="260" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">your phone</text>
  <rect x="390" y="228" width="120" height="54" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="450" y="260" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">your Pi</text>
  <rect x="190" y="214" width="150" height="82" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="265" y="246" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">overlay mesh</text>
  <text x="265" y="264" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">WireGuard</text>
  <text x="265" y="280" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">Tailscale / Nebula</text>
  <line x1="150" y1="255" x2="188" y2="255" stroke="#57b39c" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="188,255 181.608,257.854 181.608,252.146" fill="#57b39c" fill-opacity=".8"/>
  <line x1="342" y1="255" x2="388" y2="255" stroke="#57b39c" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="388,255 381.608,257.854 381.608,252.146" fill="#57b39c" fill-opacity=".8"/>
  <text x="530" y="244" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">both ends dial out.</text>
  <text x="530" y="262" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the router opens nothing.</text>
  <text x="530" y="280" fill="#57b39c" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">identity, not address.</text>
  <rect x="30" y="326" width="700" height="60" rx="9" fill="#1a2330" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="48" y="352" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">CGNAT (100.64.0.0/10) shares one public address across thousands of homes —</text>
  <text x="48" y="371" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">so on many connections port-forwarding is not risky, it is simply impossible.</text>
</svg>
