<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="400" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">TWO ISOLATION MODELS</text>

  <!-- phone -->
  <rect x="60" y="70" width="200" height="280" rx="22" fill="#151c26" stroke="#57b39c" stroke-width="2"/>
  <rect x="130" y="82" width="60" height="8" rx="4" fill="#1a2330"/>
  <g fill="#1a2330" stroke="#57b39c" stroke-opacity=".7">
    <rect x="80" y="104" width="76" height="66" rx="8"/>
    <rect x="164" y="104" width="76" height="66" rx="8"/>
    <rect x="80" y="180" width="76" height="66" rx="8"/>
    <rect x="164" y="180" width="76" height="66" rx="8"/>
  </g>
  <g fill="#e7e2d4" font-size="11" text-anchor="middle">
    <text x="118" y="132">banking</text><text x="202" y="132">WhatsApp</text>
    <text x="118" y="208">photos</text><text x="202" y="208">a bad app</text>
  </g>
  <g fill="#57b39c" font-size="10" text-anchor="middle" font-family="ui-monospace,monospace">
    <text x="118" y="152">🔒 sealed</text><text x="202" y="152">🔒 sealed</text>
    <text x="118" y="228">🔒 sealed</text><text x="202" y="228">🔒 sealed</text>
  </g>
  <text x="160" y="286" fill="#aab5c1" font-size="11" text-anchor="middle">each app in its own glass box —</text>
  <text x="160" y="302" fill="#aab5c1" font-size="11" text-anchor="middle">can't read its neighbours</text>
  <text x="160" y="336" fill="#57b39c" font-size="13" text-anchor="middle" font-weight="600">phone: prison of glass boxes</text>

  <!-- desktop -->
  <rect x="330" y="70" width="400" height="280" rx="14" fill="#151c26" stroke="#cf6f57" stroke-opacity=".6" stroke-width="2"/>
  <g fill="#1a2330" stroke="#aab5c1" stroke-opacity=".4">
    <rect x="356" y="100" width="110" height="46" rx="8"/>
    <rect x="490" y="120" width="120" height="46" rx="8"/>
    <rect x="380" y="180" width="130" height="46" rx="8"/>
    <rect x="540" y="200" width="120" height="46" rx="8"/>
  </g>
  <g fill="#e7e2d4" font-size="12">
    <text x="370" y="128">your files</text>
    <text x="504" y="148">the browser</text>
    <text x="394" y="208">any program</text>
    <text x="554" y="228">your keys?</text>
  </g>
  <g stroke="#cf6f57" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M445 200 C470 180, 480 160, 500 150"/>
    <path d="M510 208 H534"/>
  </g>
  <text x="356" y="286" fill="#aab5c1" font-size="11">one big room — a program you run can</text>
  <text x="356" y="302" fill="#aab5c1" font-size="11">usually touch most of what you can</text>
  <text x="530" y="336" fill="#cf6f57" font-size="13" text-anchor="middle" font-weight="600">desktop: one open room</text>

  <text x="30" y="378" fill="#e7e2d4" font-size="13">Why phone malware is rarer, why "granting permissions" matters —</text>
  <text x="30" y="396" fill="#e7e2d4" font-size="13">and why the Pi runs its agents <tspan fill="#57b39c">inside containers</tspan>.</text>
</svg>
