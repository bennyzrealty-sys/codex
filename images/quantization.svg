<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="380" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">QUANTIZATION — ROUND THE DIALS UNTIL THE BRAIN FITS</text>

  <!-- fp16 dial -->
  <circle cx="140" cy="150" r="58" fill="#151c26" stroke="#aab5c1" stroke-opacity=".6" stroke-width="2"/>
  <line x1="140" y1="150" x2="176" y2="112" stroke="#aab5c1" stroke-width="3"/>
  <text x="140" y="236" fill="#e7e2d4" font-size="15" text-anchor="middle">one weight, 16-bit</text>
  <text x="140" y="258" fill="#aab5c1" font-size="14" text-anchor="middle" font-family="ui-monospace,monospace">0.73824913</text>

  <path d="M230 150 H300" stroke="#dfa32b" stroke-width="2" marker-end="url(#a)"/>
  <text x="234" y="136" fill="#dfa32b" font-size="13">round it</text>

  <!-- q4 dial -->
  <circle cx="390" cy="150" r="58" fill="#151c26" stroke="#57b39c" stroke-width="2"/>
  <line x1="390" y1="150" x2="428" y2="114" stroke="#57b39c" stroke-width="4"/>
  <text x="390" y="236" fill="#e7e2d4" font-size="15" text-anchor="middle">same weight, ~4-bit</text>
  <text x="390" y="258" fill="#57b39c" font-size="14" text-anchor="middle" font-family="ui-monospace,monospace">0.75</text>

  <!-- verdict -->
  <text x="520" y="130" fill="#e7e2d4" font-size="16" font-weight="600">4× smaller,</text>
  <text x="520" y="152" fill="#e7e2d4" font-size="16" font-weight="600">barely dumber</text>
  <text x="520" y="180" fill="#aab5c1" font-size="13">GGUF Q4_K_M via</text>
  <text x="520" y="198" fill="#aab5c1" font-size="13">llama.cpp / Ollama</text>

  <!-- size bars -->
  <text x="30" y="300" fill="#aab5c1" font-size="13" font-family="ui-monospace,monospace">3B model @ 16-bit</text>
  <rect x="230" y="286" width="360" height="20" rx="5" fill="#aab5c1" fill-opacity=".45"/>
  <text x="600" y="302" fill="#aab5c1" font-size="13" font-family="ui-monospace,monospace">≈ 6 GB</text>
  <text x="30" y="332" fill="#57b39c" font-size="13" font-family="ui-monospace,monospace">3B model @ Q4</text>
  <rect x="230" y="318" width="120" height="20" rx="5" fill="#57b39c" fill-opacity=".85"/>
  <text x="360" y="334" fill="#57b39c" font-size="13" font-family="ui-monospace,monospace">≈ 2 GB — fits the Pi's 16 GB desk easily</text>

  <text x="30" y="366" fill="#e7e2d4" font-size="14">On Pi 5: 3B ≈ 6–8 tok/s (usable) · 8B ≈ 2 tok/s (painful) — <tspan fill="#dfa32b">the 3–4B class is your sweet spot</tspan></text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dfa32b"/></marker></defs>
</svg>
