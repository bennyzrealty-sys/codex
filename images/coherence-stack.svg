<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">WHY EDITING A HEADER FOOLS NOBODY — THE FLOORS BENEATH THE TEXT</text>
  <rect x="30" y="72" width="700" height="56" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="96" fill="#cf6f57" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">what you edited</text>
  <text x="190" y="96" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">User-Agent: Mozilla/5.0 …</text>
  <text x="190" y="115" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">one line of text, free to change</text>
  <text x="714" y="96" fill="#cf6f57" fill-opacity="1" font-size="11" text-anchor="end" font-weight="400">the only floor you can edit  ✎</text>
  <rect x="30" y="136" width="700" height="56" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="160" fill="#dfa32b" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">HTTP/2 frames</text>
  <text x="190" y="160" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">header order · settings · window sizes</text>
  <text x="190" y="179" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">chosen by your library, not by you</text>
  <rect x="30" y="200" width="700" height="74" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="224" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">the TLS hello</text>
  <text x="190" y="224" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">cipher list · extensions · curves · GREASE</text>
  <text x="190" y="243" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">sent in the clear, before any header</text>
  <text x="190" y="263" fill="#57b39c" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="600">the firewall reads this floor first — before a single header exists</text>
  <rect x="30" y="282" width="700" height="56" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="48" y="306" fill="#9fb4d8" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">TCP / IP</text>
  <text x="190" y="306" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">TTL · timestamps · the return address</text>
  <text x="190" y="325" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">the network's own accent</text>
  <rect x="30" y="348" width="700" height="56" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="372" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">detection wins on coherence, not on a better hash</text>
  <text x="48" y="394" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">A browser's four floors agree with each other. A script wearing a browser's hat does not.</text>
</svg>
