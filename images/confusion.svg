<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE FOUR BOXES EVERY DETECTOR LIVES IN</text>
  <rect x="250" y="88" width="200" height="72" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="350" y="120" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">true positive</text>
  <text x="350" y="140" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">caught it</text>
  <rect x="460" y="88" width="200" height="72" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="560" y="120" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">false positive</text>
  <text x="560" y="140" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">cried wolf</text>
  <rect x="250" y="168" width="200" height="72" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="350" y="200" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">false negative</text>
  <text x="350" y="220" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">missed it</text>
  <rect x="460" y="168" width="200" height="72" rx="9" fill="#1a2330" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="560" y="200" fill="#aab5c1" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">true negative</text>
  <text x="560" y="220" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">correctly quiet</text>
  <text x="350" y="76" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">actually true</text>
  <text x="560" y="76" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">actually false</text>
  <text x="240" y="128" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="end" font-weight="400" font-family="ui-monospace,monospace">flagged</text>
  <text x="240" y="208" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="end" font-weight="400" font-family="ui-monospace,monospace">not flagged</text>
  <text x="30" y="106" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">precision</text>
  <text x="30" y="126" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">of what you flagged,</text>
  <text x="30" y="141" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">how much was real</text>
  <text x="30" y="176" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">recall</text>
  <text x="30" y="196" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">of what was real, how</text>
  <text x="30" y="211" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">much you caught</text>
  <rect x="30" y="264" width="700" height="62" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="290" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">you cannot have both — where you set the threshold trades one for the other,</text>
  <text x="48" y="308" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">and which one matters depends entirely on the cost of each mistake.</text>
  <rect x="30" y="340" width="700" height="60" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="366" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the base rate trap: at 1-in-1,000 prevalence, a 99%-accurate test flags</text>
  <text x="48" y="384" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">ten false alarms for every real find. Accuracy alone is close to meaningless.</text>
</svg>
