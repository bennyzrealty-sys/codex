<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE GRAVEYARD TEST — APPLY IT TO YOUR OWN IDEA</text>
  <text x="392" y="74" fill="#e7e2d4" fill-opacity="1" font-size="14" text-anchor="middle" font-weight="600">does the next model release make this stronger, or redundant?</text>
  <rect x="30" y="96" width="340" height="220" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="124" fill="#cf6f57" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">redundant — absorbed by the next release</text>
  <text x="48" y="152" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  "prompt engineer" as a job title</text>
  <text x="48" y="174" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  thin wrappers around someone else's model</text>
  <text x="48" y="196" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  AI-text detectors (never worked, still sold)</text>
  <text x="48" y="218" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  fine-tune a model per company</text>
  <text x="48" y="240" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  the vector-database gold rush</text>
  <text x="48" y="262" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  "bigger models are all you need"</text>
  <text x="48" y="284" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  chatbots as the product</text>
  <rect x="390" y="96" width="340" height="220" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="408" y="124" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">stronger — compounds with every release</text>
  <text x="408" y="152" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  data only you have</text>
  <text x="408" y="174" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  evals only you wrote</text>
  <text x="408" y="196" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  distribution — the people who trust you</text>
  <text x="408" y="218" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  the domain workflow you actually know</text>
  <text x="408" y="240" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  judgement about what to automate</text>
  <text x="408" y="262" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  reliability: auth, rollback, audit trail</text>
  <text x="408" y="284" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">·  a node you own outright</text>
  <rect x="30" y="332" width="700" height="68" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="358" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">early is not the same as wrong</text>
  <text x="48" y="380" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">2023's autonomous-agent toys looped in circles. The idea was right; the reliability wasn't.</text>
</svg>
