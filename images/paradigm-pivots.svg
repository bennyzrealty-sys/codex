<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">HOW THE THINKING TURNED — AND WHERE YOU CAME IN</text>
  <line x1="50" y1="150" x2="720" y2="150" stroke="#aab5c1" stroke-opacity=".35" stroke-width="1.2"/>
  <circle cx="74" cy="150" r="9" fill="#1a2330" stroke="#aab5c1"/>
  <text x="74" y="120" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">pre-2012</text>
  <text x="74" y="184" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">hand-written</text>
  <text x="74" y="199" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">rules</text>
  <text x="74" y="224" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">experts wrote every</text>
  <text x="74" y="238" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">rule</text>
  <circle cx="228" cy="150" r="9" fill="#1a2330" stroke="#9fb4d8"/>
  <text x="228" y="120" fill="#9fb4d8" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">2012</text>
  <text x="228" y="184" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">learn from</text>
  <text x="228" y="199" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">examples</text>
  <text x="228" y="224" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">the deep-learning</text>
  <text x="228" y="238" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">turn</text>
  <circle cx="382" cy="150" r="9" fill="#1a2330" stroke="#57b39c"/>
  <text x="382" y="120" fill="#57b39c" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">2018–23</text>
  <text x="382" y="184" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">one giant model,</text>
  <text x="382" y="199" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">steered</text>
  <text x="382" y="224" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">pretrain, then align</text>
  <circle cx="536" cy="150" r="9" fill="#1a2330" stroke="#dfa32b"/>
  <text x="536" y="120" fill="#dfa32b" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">2024–25</text>
  <text x="536" y="184" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">make it think</text>
  <text x="536" y="199" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">longer</text>
  <text x="536" y="224" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">reasoning at</text>
  <text x="536" y="238" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">answer-time</text>
  <circle cx="690" cy="150" r="9" fill="#1a2330" stroke="#cf6f57"/>
  <text x="690" y="120" fill="#cf6f57" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">2025–26</text>
  <text x="690" y="184" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">wire it into real</text>
  <text x="690" y="199" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">systems</text>
  <text x="690" y="224" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">the integration era</text>
  <text x="686" y="98" fill="#cf6f57" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="600">you are here</text>
  <line x1="686" y1="106" x2="686" y2="110" stroke="#cf6f57" stroke-opacity=".6" stroke-width="1.2"/>
  <rect x="30" y="250" width="700" height="72" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="274" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the craft pivoted with it</text>
  <text x="48" y="296" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">clever prompts → curated context   ·   impressive demos → boring evals</text>
  <text x="48" y="314" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">"which model is smartest" → "who can wire one into a real system safely"</text>
  <rect x="30" y="330" width="700" height="70" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="356" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the frontier question changed shape</text>
  <text x="48" y="378" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">from "can it?" to "can it be trusted, audited and afforded — repeatedly?"</text>
</svg>
