<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">WHAT TO PATCH FIRST — THREE NUMBERS, ONE DECISION</text>
  <rect x="30" y="78" width="216" height="152" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="138" y="108" fill="#dfa32b" fill-opacity="1" font-size="16" text-anchor="middle" font-weight="600">CVSS</text>
  <text x="138" y="134" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="400">how bad if used</text>
  <text x="138" y="162" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">0 – 10 severity</text>
  <line x1="60" y1="180" x2="216" y2="180" stroke="#dfa32b" stroke-opacity=".3" stroke-width="1"/>
  <text x="138" y="204" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">thousands score 9+</text>
  <rect x="266" y="78" width="216" height="152" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="374" y="108" fill="#57b39c" fill-opacity="1" font-size="16" text-anchor="middle" font-weight="600">EPSS</text>
  <text x="374" y="134" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="400">will it be used</text>
  <text x="374" y="162" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">probability, 30 days</text>
  <line x1="296" y1="180" x2="452" y2="180" stroke="#57b39c" stroke-opacity=".3" stroke-width="1"/>
  <text x="374" y="204" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">most 9s never are</text>
  <rect x="502" y="78" width="216" height="152" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="610" y="108" fill="#cf6f57" fill-opacity="1" font-size="16" text-anchor="middle" font-weight="600">KEV</text>
  <text x="610" y="134" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="400">already being used</text>
  <text x="610" y="162" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">CISA's exploited list</text>
  <line x1="532" y1="180" x2="688" y2="180" stroke="#cf6f57" stroke-opacity=".3" stroke-width="1"/>
  <text x="610" y="204" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">this one, tonight</text>
  <rect x="30" y="252" width="700" height="74" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="280" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the rule that keeps a one-person estate sane</text>
  <text x="48" y="304" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Patch everything on KEV now. Then anything with high EPSS. Severity alone is a</text>
  <text x="48" y="322" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">queue you will never finish — and finishing it was never the point.</text>
  <text x="30" y="360" fill="#dfa32b" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">and the unglamorous truth beneath all three:</text>
  <text x="30" y="384" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">unattended-upgrades on the node closes more real doors than any dashboard.</text>
</svg>
