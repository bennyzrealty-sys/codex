<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">ONE CLICK — THE FIVE THINGS THAT HAPPEN BEFORE A PAGE APPEARS</text>
  <rect x="30" y="92" width="122" height="62" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="91" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">you type</text>
  <text x="91" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">a name</text>
  <line x1="152" y1="123" x2="170" y2="123" stroke="#dfa32b" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="170,123 163.608,125.854 163.608,120.146" fill="#dfa32b" fill-opacity=".8"/>
  <rect x="170" y="92" width="122" height="62" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="231" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">DNS</text>
  <text x="231" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">name → number</text>
  <line x1="292" y1="123" x2="310" y2="123" stroke="#9fb4d8" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="310,123 303.608,125.854 303.608,120.146" fill="#9fb4d8" fill-opacity=".8"/>
  <rect x="310" y="92" width="122" height="62" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="371" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">TCP</text>
  <text x="371" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">the handshake</text>
  <line x1="432" y1="123" x2="450" y2="123" stroke="#57b39c" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="450,123 443.608,125.854 443.608,120.146" fill="#57b39c" fill-opacity=".8"/>
  <rect x="450" y="92" width="122" height="62" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="511" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">TLS</text>
  <text x="511" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">the padlock</text>
  <line x1="572" y1="123" x2="590" y2="123" stroke="#57b39c" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="590,123 583.608,125.854 583.608,120.146" fill="#57b39c" fill-opacity=".8"/>
  <rect x="590" y="92" width="122" height="62" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="651" y="120" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">HTTP</text>
  <text x="651" y="138" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">the actual ask</text>
  <text x="30" y="190" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">each stop can fail on its own — and each fails with its own accent</text>
  <line x1="90" y1="200" x2="90" y2="216" stroke="#dfa32b" stroke-opacity=".35" stroke-width="1"/>
  <text x="30" y="232" fill="#dfa32b" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">typo, or a domain</text>
  <text x="30" y="247" fill="#dfa32b" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">that never existed</text>
  <line x1="230" y1="200" x2="230" y2="216" stroke="#9fb4d8" stroke-opacity=".35" stroke-width="1"/>
  <text x="170" y="232" fill="#9fb4d8" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">NXDOMAIN · resolver</text>
  <text x="170" y="247" fill="#9fb4d8" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">unreachable · stale</text>
  <text x="170" y="262" fill="#9fb4d8" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">cache</text>
  <line x1="370" y1="200" x2="370" y2="216" stroke="#57b39c" stroke-opacity=".35" stroke-width="1"/>
  <text x="310" y="232" fill="#57b39c" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">connection refused ·</text>
  <text x="310" y="247" fill="#57b39c" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">timeout · no route</text>
  <line x1="510" y1="200" x2="510" y2="216" stroke="#57b39c" stroke-opacity=".35" stroke-width="1"/>
  <text x="450" y="232" fill="#57b39c" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">certificate expired</text>
  <text x="450" y="247" fill="#57b39c" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">· name mismatch</text>
  <line x1="650" y1="200" x2="650" y2="216" stroke="#dfa32b" stroke-opacity=".35" stroke-width="1"/>
  <text x="590" y="232" fill="#dfa32b" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">404 · 500 · 429 too</text>
  <text x="590" y="247" fill="#dfa32b" fill-opacity=".85" font-size="11" text-anchor="start" font-weight="400">many requests</text>
  <rect x="30" y="306" width="700" height="76" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="334" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the layer beneath the text</text>
  <text x="48" y="356" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">TLS sends its hello in the clear — the cipher list is a fingerprint (JA4).</text>
  <text x="48" y="373" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Changing a header changes nothing one floor down. See the Deep Field.</text>
</svg>
