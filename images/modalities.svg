<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">ONE ARCHITECTURE, FIVE SENSES — WHERE MODELS GREW HANDS</text>
  <rect x="30" y="74" width="700" height="56" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="52" y="108" fill="#dfa32b" fill-opacity="1" font-size="15" text-anchor="start" font-weight="600">text</text>
  <text x="172" y="108" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">read &amp; write</text>
  <text x="392" y="108" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the original</text>
  <rect x="30" y="140" width="700" height="56" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="52" y="174" fill="#57b39c" fill-opacity="1" font-size="15" text-anchor="start" font-weight="600">vision</text>
  <text x="172" y="174" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">see images, screens, scans</text>
  <text x="392" y="174" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">VLM · OCR is solved</text>
  <rect x="30" y="206" width="700" height="56" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="52" y="240" fill="#9fb4d8" fill-opacity="1" font-size="15" text-anchor="start" font-weight="600">audio</text>
  <text x="172" y="240" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">hear &amp; speak</text>
  <text x="392" y="240" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">ASR · TTS · real-time voice</text>
  <rect x="30" y="272" width="700" height="56" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="52" y="306" fill="#57b39c" fill-opacity="1" font-size="15" text-anchor="start" font-weight="600">video</text>
  <text x="172" y="306" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">watch &amp; predict</text>
  <text x="392" y="306" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">world models, still young</text>
  <rect x="30" y="338" width="700" height="56" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="52" y="372" fill="#cf6f57" fill-opacity="1" font-size="15" text-anchor="start" font-weight="600">action</text>
  <text x="172" y="372" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">move &amp; operate</text>
  <text x="392" y="372" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">VLA · robots · computer use</text>
  <rect x="30" y="374" width="700" height="26" rx="8" fill="#1a2330" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="48" y="392" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">all five are tokens in the end — which is why one architecture ate every field.</text>
</svg>
