<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="440" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">GIT — SNAPSHOTS, DRAFTS, AND THE REPLAY</text>

  <!-- merge panel -->
  <text x="30" y="76" fill="#e7e2d4" font-size="15" font-weight="600">branch → PR → merge</text>
  <!-- main line -->
  <g stroke="#dfa32b" stroke-width="2.5">
    <line x1="60" y1="140" x2="620" y2="140"/>
  </g>
  <g stroke="#57b39c" stroke-width="2.5" fill="none">
    <path d="M200 140 C240 140, 240 96, 280 96 L420 96 C470 96, 470 140, 510 140"/>
  </g>
  <g fill="#dfa32b" stroke="#0d1219" stroke-width="2">
    <circle cx="90" cy="140" r="9"/><circle cx="200" cy="140" r="9"/><circle cx="380" cy="140" r="9"/><circle cx="510" cy="140" r="9"/>
  </g>
  <g fill="#57b39c" stroke="#0d1219" stroke-width="2">
    <circle cx="300" cy="96" r="9"/><circle cx="410" cy="96" r="9"/>
  </g>
  <g fill="#aab5c1" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="90" y="168">a1f9c02</text><text x="200" y="168">8aa47a0</text><text x="380" y="168">1b22d90</text><text x="510" y="168">3cfaec8</text>
    <text x="300" y="82">feat #1</text><text x="410" y="82">feat #2</text>
  </g>
  <text x="640" y="145" fill="#dfa32b" font-size="13" font-family="ui-monospace,monospace">main</text>
  <text x="330" y="62" fill="#57b39c" font-size="12">your branch — a parallel draft</text>
  <text x="470" y="120" fill="#e7e2d4" font-size="12">PR accepted ⇒ merge commit</text>

  <!-- rebase panel -->
  <text x="30" y="230" fill="#e7e2d4" font-size="15" font-weight="600">rebase — same work, new foundation, new serial numbers</text>
  <g stroke="#dfa32b" stroke-width="2.5"><line x1="60" y1="290" x2="430" y2="290"/></g>
  <g fill="#dfa32b" stroke="#0d1219" stroke-width="2">
    <circle cx="90" cy="290" r="9"/><circle cx="200" cy="290" r="9"/><circle cx="310" cy="290" r="9"/>
  </g>
  <text x="310" y="318" fill="#aab5c1" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">someone else's merge landed</text>
  <!-- old commits ghost -->
  <g fill="none" stroke="#57b39c" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 4">
    <circle cx="250" cy="246" r="9"/><circle cx="320" cy="246" r="9"/>
  </g>
  <text x="60" y="250" fill="#aab5c1" font-size="11" opacity=".7">your commits, old base →</text>
  <!-- replayed -->
  <g fill="#57b39c" stroke="#0d1219" stroke-width="2">
    <circle cx="510" cy="290" r="9"/><circle cx="590" cy="290" r="9"/>
  </g>
  <g stroke="#57b39c" stroke-width="2.5"><line x1="430" y1="290" x2="620" y2="290"/></g>
  <path d="M330 246 C420 246, 440 268, 495 284" stroke="#57b39c" stroke-width="2" fill="none" marker-end="url(#t)"/>
  <text x="392" y="240" fill="#57b39c" font-size="12">lift &amp; replay on the new tip</text>
  <g fill="#aab5c1" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="510" y="318">f81aa3e′</text><text x="590" y="318">c07d215′</text>
  </g>
  <text x="636" y="295" fill="#cf6f57" font-size="12">new hashes!</text>

  <rect x="30" y="360" width="700" height="56" rx="10" fill="#151c26" stroke="#dfa32b" stroke-opacity=".5"/>
  <text x="48" y="384" fill="#e7e2d4" font-size="14"><tspan fill="#dfa32b" font-weight="600">committed</tspan> = saved locally · <tspan fill="#57b39c" font-weight="600">pushed</tspan> = safe on GitHub, forever</text>
  <text x="48" y="404" fill="#aab5c1" font-size="12">in an ephemeral container, unpushed work is one power-cycle from gone</text>

  <defs><marker id="t" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#57b39c"/></marker></defs>
</svg>
