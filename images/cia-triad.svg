<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE THREE QUESTIONS EVERY SECURITY DECISION ANSWERS</text>
  <polygon points="392,130 176,268 608,268" fill="none" stroke="#aab5c1" stroke-opacity=".3" stroke-width="1.4"/>
  <circle cx="392" cy="130" r="30" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".85"/>
  <text x="392" y="82" fill="#dfa32b" fill-opacity="1" font-size="14" text-anchor="middle" font-weight="600">confidentiality</text>
  <text x="392" y="100" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">only the right eyes</text>
  <circle cx="176" cy="268" r="30" fill="#1a2330" stroke="#57b39c" stroke-opacity=".85"/>
  <text x="176" y="320" fill="#57b39c" fill-opacity="1" font-size="14" text-anchor="middle" font-weight="600">integrity</text>
  <text x="176" y="338" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">unchanged, and provably so</text>
  <circle cx="608" cy="268" r="30" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".85"/>
  <text x="608" y="320" fill="#cf6f57" fill-opacity="1" font-size="14" text-anchor="middle" font-weight="600">availability</text>
  <text x="608" y="338" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">there when needed</text>
  <text x="392" y="214" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="400">every control</text>
  <text x="392" y="234" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">trades one for another</text>
  <rect x="30" y="362" width="700" height="44" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="382" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">harden it and availability falls; copy it about and confidentiality spreads.</text>
  <text x="48" y="399" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">There is no maximum — only a balance you chose on purpose, and wrote down.</text>
</svg>
