<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">CONTEXT ENGINEERING — THE REAL SKILL BEHIND THE PROMPT</text>
  <rect x="30" y="76" width="420" height="44" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="103" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">system</text>
  <text x="180" y="103" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">who it is, what it may not do</text>
  <rect x="30" y="130" width="420" height="44" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="157" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">tools</text>
  <text x="180" y="157" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the verbs it is allowed</text>
  <rect x="30" y="184" width="420" height="44" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="211" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">retrieved facts</text>
  <text x="180" y="211" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">only what this task needs</text>
  <rect x="30" y="238" width="420" height="44" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="265" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the ask</text>
  <text x="180" y="265" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">one task, stated once</text>
  <rect x="30" y="292" width="420" height="44" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="48" y="319" fill="#9fb4d8" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">format</text>
  <text x="180" y="319" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the shape of the answer</text>
  <line x1="456" y1="84" x2="456" y2="328" stroke="#aab5c1" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 6"/>
  <rect x="476" y="76" width="254" height="128" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="494" y="102" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">what fails</text>
  <text x="494" y="126" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">stuffing everything in</text>
  <text x="494" y="146" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the whole document</text>
  <text x="494" y="166" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">ten tasks in one breath</text>
  <text x="494" y="186" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">chat history nobody pruned</text>
  <rect x="476" y="216" width="254" height="112" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="494" y="242" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">what works</text>
  <text x="494" y="266" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">less, but exactly right</text>
  <text x="494" y="286" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">examples over adjectives</text>
  <text x="494" y="306" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">a schema, not a plea</text>
  <rect x="30" y="344" width="700" height="54" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="368" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the window is a desk, not a warehouse. Everything you put on it competes for</text>
  <text x="48" y="386" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">attention with everything else — including the instruction that mattered.</text>
</svg>
