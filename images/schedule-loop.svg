<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">MAKING SOMETHING HAPPEN WITHOUT YOU — THE FOUR CLOCKS</text>
  <rect x="30" y="78" width="168" height="58" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="114" y="104" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">cron</text>
  <text x="114" y="122" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">0 6 */2 * *</text>
  <line x1="198" y1="107" x2="232" y2="107" stroke="#dfa32b" stroke-opacity=".6" stroke-width="1.6"/>
  <polygon points="232,107 225.608,109.854 225.608,104.146" fill="#dfa32b" fill-opacity=".6"/>
  <text x="244" y="112" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">simplest. no logs, minimal PATH, no overlap guard.</text>
  <rect x="30" y="152" width="168" height="58" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="114" y="178" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">systemd timer</text>
  <text x="114" y="196" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">OnCalendar=</text>
  <line x1="198" y1="181" x2="232" y2="181" stroke="#57b39c" stroke-opacity=".6" stroke-width="1.6"/>
  <polygon points="232,181 225.608,183.854 225.608,178.146" fill="#57b39c" fill-opacity=".6"/>
  <text x="244" y="186" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">journald logs, dependencies, restart policy.</text>
  <rect x="30" y="226" width="168" height="58" rx="9" fill="#151c26" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="114" y="252" fill="#9fb4d8" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">CI schedule</text>
  <text x="114" y="270" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">GitHub Actions</text>
  <line x1="198" y1="255" x2="232" y2="255" stroke="#9fb4d8" stroke-opacity=".6" stroke-width="1.6"/>
  <polygon points="232,255 225.608,257.854 225.608,252.146" fill="#9fb4d8" fill-opacity=".6"/>
  <text x="244" y="260" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">runs on someone else's metal. free, but queued.</text>
  <rect x="30" y="300" width="168" height="58" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="114" y="326" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="600">event / webhook</text>
  <text x="114" y="344" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">on: push</text>
  <line x1="198" y1="329" x2="232" y2="329" stroke="#cf6f57" stroke-opacity=".6" stroke-width="1.6"/>
  <polygon points="232,329 225.608,331.854 225.608,326.146" fill="#cf6f57" fill-opacity=".6"/>
  <text x="244" y="334" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">not a clock at all — it fires when reality does.</text>
  <rect x="30" y="366" width="700" height="40" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="48" y="392" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">the bite everyone takes once: a cron job runs in UTC, with no shell profile and no PATH.</text>
</svg>
