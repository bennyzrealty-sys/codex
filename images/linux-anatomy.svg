<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE MACHINE'S OWN ANATOMY — WHAT SITS WHERE ON LINUX</text>
  <rect x="30" y="70" width="700" height="92" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="96" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">userspace — everything you install and run</text>
  <rect x="48" y="112" width="148" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="122" y="128" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">your python script</text>
  <rect x="208" y="112" width="64" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="240" y="128" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">ollama</text>
  <rect x="284" y="112" width="64" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="316" y="128" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">docker</text>
  <rect x="360" y="112" width="57" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="388.5" y="128" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">nginx</text>
  <rect x="429" y="112" width="50" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="454" y="128" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">sshd</text>
  <text x="48" y="152" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">unprivileged · owns nothing it was not given</text>
  <line x1="120" y1="168" x2="120" y2="196" stroke="#57b39c" stroke-opacity=".55" stroke-width="1.3"/>
  <polygon points="120,196 117.146,189.608 122.854,189.608" fill="#57b39c" fill-opacity=".55"/>
  <line x1="250" y1="168" x2="250" y2="196" stroke="#57b39c" stroke-opacity=".55" stroke-width="1.3"/>
  <polygon points="250,196 247.146,189.608 252.854,189.608" fill="#57b39c" fill-opacity=".55"/>
  <line x1="380" y1="168" x2="380" y2="196" stroke="#57b39c" stroke-opacity=".55" stroke-width="1.3"/>
  <polygon points="380,196 377.146,189.608 382.854,189.608" fill="#57b39c" fill-opacity=".55"/>
  <line x1="510" y1="168" x2="510" y2="196" stroke="#57b39c" stroke-opacity=".55" stroke-width="1.3"/>
  <polygon points="510,196 507.146,189.608 512.854,189.608" fill="#57b39c" fill-opacity=".55"/>
  <line x1="640" y1="168" x2="640" y2="196" stroke="#57b39c" stroke-opacity=".55" stroke-width="1.3"/>
  <polygon points="640,196 637.146,189.608 642.854,189.608" fill="#57b39c" fill-opacity=".55"/>
  <text x="392" y="188" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">syscalls — the only way through</text>
  <rect x="30" y="200" width="700" height="78" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="48" y="226" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the kernel — the only code that touches the metal</text>
  <text x="48" y="250" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">scheduler · memory · filesystems · network stack · drivers · permissions</text>
  <text x="48" y="268" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">decides, every single time, whether a process may do the thing it asked</text>
  <rect x="30" y="292" width="700" height="44" rx="9" fill="#151c26" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="48" y="320" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="start" font-weight="400">hardware — CPU · RAM · SSD · NIC · GPIO</text>
  <text x="30" y="366" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">permissions, read once and never forgotten:</text>
  <rect x="30" y="378" width="183" height="24" rx="12" fill="none" stroke="#cf6f57" stroke-opacity=".6"/>
  <text x="121.5" y="394" fill="#cf6f57" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">600  secrets — only you</text>
  <rect x="217" y="378" width="155" height="24" rx="12" fill="none" stroke="#aab5c1" stroke-opacity=".6"/>
  <text x="294.5" y="394" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">644  ordinary files</text>
  <rect x="376" y="378" width="162" height="24" rx="12" fill="none" stroke="#57b39c" stroke-opacity=".6"/>
  <text x="457" y="394" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">755  things that run</text>
  <rect x="542" y="378" width="169" height="24" rx="12" fill="none" stroke="#dfa32b" stroke-opacity=".6"/>
  <text x="626.5" y="394" fill="#dfa32b" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">root  avoid; use sudo</text>
</svg>
