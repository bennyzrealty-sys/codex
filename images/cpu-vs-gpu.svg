<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="400" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">TWO SHAPES OF WORK</text>

  <!-- CPU side -->
  <rect x="30" y="62" width="340" height="270" rx="12" fill="#151c26" stroke="#dfa32b" stroke-opacity=".5"/>
  <text x="50" y="94" fill="#e7e2d4" font-size="18" font-weight="600">CPU</text>
  <g fill="#1a2330" stroke="#dfa32b" stroke-opacity=".8" stroke-width="1.5">
    <rect x="60" y="112" width="120" height="80" rx="10"/>
    <rect x="200" y="112" width="120" height="80" rx="10"/>
    <rect x="60" y="204" width="120" height="80" rx="10"/>
    <rect x="200" y="204" width="120" height="80" rx="10"/>
  </g>
  <g fill="#dfa32b" font-size="13" font-family="ui-monospace,monospace" text-anchor="middle">
    <text x="120" y="157">worker 1</text><text x="260" y="157">worker 2</text>
    <text x="120" y="249">worker 3</text><text x="260" y="249">worker 4</text>
  </g>
  <text x="50" y="316" fill="#aab5c1" font-size="13">four strong generalists — one step after another</text>

  <!-- GPU side -->
  <rect x="390" y="62" width="340" height="270" rx="12" fill="#151c26" stroke="#57b39c" stroke-opacity=".5"/>
  <text x="410" y="94" fill="#e7e2d4" font-size="18" font-weight="600">GPU</text>
  <g fill="#57b39c" fill-opacity=".6">
    <g id="row">
      <rect x="412" y="112" width="17" height="17" rx="2"/><rect x="433" y="112" width="17" height="17" rx="2"/><rect x="454" y="112" width="17" height="17" rx="2"/><rect x="475" y="112" width="17" height="17" rx="2"/><rect x="496" y="112" width="17" height="17" rx="2"/><rect x="517" y="112" width="17" height="17" rx="2"/><rect x="538" y="112" width="17" height="17" rx="2"/><rect x="559" y="112" width="17" height="17" rx="2"/><rect x="580" y="112" width="17" height="17" rx="2"/><rect x="601" y="112" width="17" height="17" rx="2"/><rect x="622" y="112" width="17" height="17" rx="2"/><rect x="643" y="112" width="17" height="17" rx="2"/><rect x="664" y="112" width="17" height="17" rx="2"/><rect x="685" y="112" width="17" height="17" rx="2"/>
    </g>
    <use href="#row" y="21"/><use href="#row" y="42"/><use href="#row" y="63"/>
    <use href="#row" y="84"/><use href="#row" y="105"/><use href="#row" y="126"/><use href="#row" y="147"/>
  </g>
  <text x="410" y="316" fill="#aab5c1" font-size="13">thousands of tiny workers — same sum, at once</text>

  <text x="30" y="366" fill="#e7e2d4" font-size="14">A transformer is mostly giant matrix multiplications — exactly the GPU's shape of job.</text>
  <text x="30" y="386" fill="#aab5c1" font-size="13">The usual real bottleneck for token generation isn't the maths — it's <tspan fill="#57b39c">memory bandwidth</tspan>.</text>
</svg>
