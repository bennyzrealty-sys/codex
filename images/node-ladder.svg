<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="460" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE LADDER — THE BOX NEVER CHANGES, ITS RESPONSIBILITY DOES</text>
  <rect x="30" y="350" width="108" height="44" rx="9" fill="#151c26" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="84" y="378" fill="#aab5c1" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L0</text>
  <text x="84" y="294" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">first light</text>
  <text x="84" y="320" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">reachable, safe,</text>
  <text x="84" y="333" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">yours</text>
  <rect x="148" y="312" width="108" height="82" rx="9" fill="#1a2330" stroke="#9fb4d8" stroke-opacity=".55"/>
  <text x="202" y="378" fill="#9fb4d8" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L1</text>
  <text x="202" y="256" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">the proving week</text>
  <text x="202" y="282" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">one unattended job</text>
  <text x="202" y="295" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">for 7 days</text>
  <rect x="266" y="274" width="108" height="120" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="320" y="378" fill="#57b39c" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L2</text>
  <text x="320" y="218" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">the orchestrator</text>
  <text x="320" y="244" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">it directs rented</text>
  <text x="320" y="257" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">intelligence</text>
  <rect x="384" y="236" width="108" height="158" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="438" y="378" fill="#57b39c" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L3</text>
  <text x="438" y="180" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">Meera's body</text>
  <text x="438" y="206" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">one memory every</text>
  <text x="438" y="219" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">project reads</text>
  <rect x="502" y="198" width="108" height="196" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="556" y="378" fill="#dfa32b" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L4</text>
  <text x="556" y="142" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">the local mind</text>
  <text x="556" y="168" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">private inference,</text>
  <text x="556" y="181" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">free per use</text>
  <rect x="620" y="160" width="108" height="234" rx="9" fill="#1a2330" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="674" y="378" fill="#cf6f57" fill-opacity="1" font-size="15" text-anchor="middle" font-weight="600" font-family="ui-monospace,monospace">L5</text>
  <text x="674" y="104" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="middle" font-weight="400">the conglomerate</text>
  <text x="674" y="130" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">operations dept of</text>
  <text x="674" y="143" fill="#aab5c1" fill-opacity="1" font-size="10.5" text-anchor="middle" font-weight="400">3 businesses</text>
  <line x1="30" y1="398" x2="730" y2="398" stroke="#aab5c1" stroke-opacity=".3" stroke-width="1"/>
  <text x="30" y="424" fill="#dfa32b" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">watts at every rung: about ten</text>
  <text x="392" y="424" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="middle" font-weight="400">what changes is trust, not hardware</text>
  <text x="730" y="424" fill="#cf6f57" fill-opacity="1" font-size="12" text-anchor="end" font-weight="400">headcount: zero</text>
  <text x="30" y="76" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">each rung is only allowed to start once the one below it has run boringly for a week</text>
</svg>
