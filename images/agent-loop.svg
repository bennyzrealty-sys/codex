<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="440" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">THE AGENT LOOP — A MODEL WITH HANDS AND A GOAL</text>

  <!-- centre goal -->
  <circle cx="260" cy="240" r="52" fill="#151c26" stroke="#dfa32b" stroke-opacity=".7"/>
  <text x="260" y="236" fill="#dfa32b" font-size="13" text-anchor="middle" font-family="ui-monospace,monospace">GOAL</text>
  <text x="260" y="254" fill="#aab5c1" font-size="11" text-anchor="middle">"ship the film"</text>

  <!-- four stations -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="190" y="66" width="140" height="52" rx="10" fill="#151c26" stroke="#57b39c"/>
    <text x="260" y="88" fill="#e7e2d4">LOOK</text>
    <text x="260" y="106" fill="#aab5c1" font-size="11" font-weight="400">read the situation</text>

    <rect x="420" y="214" width="150" height="52" rx="10" fill="#151c26" stroke="#57b39c"/>
    <text x="495" y="236" fill="#e7e2d4">THINK</text>
    <text x="495" y="254" fill="#aab5c1" font-size="11" font-weight="400">decide the next step</text>

    <rect x="190" y="362" width="140" height="52" rx="10" fill="#151c26" stroke="#57b39c"/>
    <text x="260" y="384" fill="#e7e2d4">ACT</text>
    <text x="260" y="402" fill="#aab5c1" font-size="11" font-weight="400">call a tool</text>

    <rect x="-40" y="214" width="150" height="52" rx="10" fill="#151c26" stroke="#57b39c" transform="translate(90 0)"/>
    <text x="125" y="236" fill="#e7e2d4">CHECK</text>
    <text x="125" y="254" fill="#aab5c1" font-size="11" font-weight="400">did it work?</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#57b39c" stroke-width="2.5" fill="none">
    <path d="M340 92 C440 110, 490 150, 495 208" marker-end="url(#t)"/>
    <path d="M488 272 C470 330, 400 375, 336 388" marker-end="url(#t)"/>
    <path d="M186 388 C120 372, 80 330, 118 272" marker-end="url(#t)"/>
    <path d="M122 208 C130 150, 170 110, 184 94" marker-end="url(#t)"/>
  </g>

  <!-- exit -->
  <path d="M572 240 H620" stroke="#dfa32b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="630" y="234" fill="#dfa32b" font-size="16" font-weight="600">done ✓</text>
  <text x="630" y="254" fill="#aab5c1" font-size="11">or hits its limits</text>

  <!-- reliability plaque -->
  <rect x="560" y="300" width="180" height="114" rx="10" fill="#151c26" stroke="#cf6f57" stroke-opacity=".6"/>
  <text x="576" y="326" fill="#cf6f57" font-size="13" font-weight="600">why small steps win</text>
  <text x="576" y="350" fill="#e7e2d4" font-size="13" font-family="ui-monospace,monospace">95%²⁰ ≈ 36%</text>
  <text x="576" y="372" fill="#aab5c1" font-size="11">20 steps at 95% each →</text>
  <text x="576" y="388" fill="#aab5c1" font-size="11">only ⅓ of runs survive.</text>
  <text x="576" y="404" fill="#aab5c1" font-size="11">Verify. Constantly.</text>

  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#57b39c"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#dfa32b"/></marker>
  </defs>
</svg>
