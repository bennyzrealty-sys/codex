<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">WHERE A KEY LIVES — WORST TO BEST</text>
  <rect x="30" y="280" width="470" height="52" rx="9" fill="#151c26" stroke="#cf6f57" stroke-opacity=".55"/>
  <text x="46" y="302" fill="#cf6f57" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">hardcoded in the code</text>
  <text x="46" y="320" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">in git history forever · travels with every clone and fork</text>
  <text x="512" y="312" fill="#cf6f57" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">worst</text>
  <rect x="30" y="218" width="470" height="52" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="46" y="240" fill="#dfa32b" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">a .env file on the box</text>
  <text x="46" y="258" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">out of the repo — but readable by anything that gets on the box</text>
  <text x="512" y="250" fill="#dfa32b" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">better</text>
  <rect x="30" y="156" width="470" height="52" rx="9" fill="#151c26" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="46" y="178" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">platform env vars / secret manager</text>
  <text x="46" y="196" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">injected at start · never committed · rotatable in one place</text>
  <text x="512" y="188" fill="#57b39c" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">good</text>
  <rect x="30" y="94" width="470" height="52" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="46" y="116" fill="#57b39c" fill-opacity="1" font-size="12.5" text-anchor="start" font-weight="600">short-lived scoped token, minted per job</text>
  <text x="46" y="134" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400">expires before it can be traded · scoped to one task</text>
  <text x="512" y="126" fill="#57b39c" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">best</text>
  <line x1="586" y1="288" x2="586" y2="84" stroke="#57b39c" stroke-opacity=".6" stroke-width="1.4"/>
  <polygon points="586,84 588.854,90.3916 583.146,90.3916" fill="#57b39c" fill-opacity=".6"/>
  <text x="600" y="190" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">each rung shortens</text>
  <text x="600" y="208" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">the blast radius of</text>
  <text x="600" y="226" fill="#aab5c1" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">one leaked string</text>
  <rect x="30" y="342" width="700" height="60" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="366" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the kettle and the plug socket</text>
  <text x="48" y="388" fill="#e7e2d4" fill-opacity="1" font-size="11.5" text-anchor="start" font-weight="400">The same kettle works in Sheffield and Kottayam — only the socket changes. Rotate on the day someone leaves.</text>
</svg>
