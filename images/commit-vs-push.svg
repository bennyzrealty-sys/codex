<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="760" height="420" fill="#0d1219"/>
  <text x="30" y="40" fill="#dfa32b" font-size="13" letter-spacing="3" font-family="ui-monospace,monospace">COMMITTED IS SAVED · PUSHED IS SAFE</text>
  <rect x="30" y="76" width="392" height="188" rx="10" fill="#151c26" stroke="#cf6f57" stroke-opacity=".7" stroke-dasharray="6 5"/>
  <text x="48" y="100" fill="#cf6f57" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the session's workshop — disposable</text>
  <rect x="48" y="118" width="150" height="56" rx="9" fill="#151c26" stroke="#aab5c1" stroke-opacity=".55"/>
  <text x="123" y="143" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">your edits</text>
  <text x="123" y="161" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">in the working tree</text>
  <line x1="198" y1="146" x2="246" y2="146" stroke="#dfa32b" stroke-opacity=".8" stroke-width="1.6"/>
  <polygon points="246,146 239.608,148.854 239.608,143.146" fill="#dfa32b" fill-opacity=".8"/>
  <text x="222" y="138" fill="#dfa32b" fill-opacity="1" font-size="10" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">commit</text>
  <rect x="246" y="118" width="156" height="56" rx="9" fill="#151c26" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="324" y="143" fill="#e7e2d4" fill-opacity="1" font-size="13" text-anchor="middle" font-weight="500">8aa47a0</text>
  <text x="324" y="161" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400">saved — but only here</text>
  <text x="48" y="202" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">close the session and this whole box is shredded:</text>
  <text x="48" y="222" fill="#cf6f57" fill-opacity="1" font-size="12" text-anchor="start" font-weight="600">the commit that never left never existed.</text>
  <text x="48" y="246" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">"one thing goes with the container: 8aa47a0 is unpushed"</text>
  <line x1="422" y1="146" x2="486" y2="146" stroke="#57b39c" stroke-opacity=".8" stroke-width="2"/>
  <polygon points="486,146 479.608,148.854 479.608,143.146" fill="#57b39c" fill-opacity=".8"/>
  <text x="454" y="136" fill="#57b39c" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">git push</text>
  <text x="454" y="172" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="middle" font-weight="400" font-family="ui-monospace,monospace">~10 s</text>
  <rect x="486" y="76" width="244" height="188" rx="9" fill="#1a2330" stroke="#57b39c" stroke-opacity=".55"/>
  <text x="504" y="104" fill="#57b39c" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">GitHub · origin/main</text>
  <text x="504" y="132" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">durable</text>
  <text x="504" y="152" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">shared with your other agents</text>
  <text x="504" y="172" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">survives every container</text>
  <text x="504" y="206" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">branches are free —</text>
  <text x="504" y="224" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">park a backup/ branch</text>
  <text x="504" y="242" fill="#aab5c1" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">before any history surgery</text>
  <rect x="30" y="286" width="700" height="58" rx="9" fill="#1a2330" stroke="#dfa32b" stroke-opacity=".55"/>
  <text x="48" y="310" fill="#dfa32b" fill-opacity="1" font-size="13" text-anchor="start" font-weight="600">the reflex worth building</text>
  <text x="48" y="332" fill="#e7e2d4" fill-opacity="1" font-size="12" text-anchor="start" font-weight="400">Say "push" before you say anything else. Ten seconds beats an afternoon of work.</text>
  <text x="30" y="378" fill="#aab5c1" fill-opacity="1" font-size="11" text-anchor="start" font-weight="400" font-family="ui-monospace,monospace">the same shape underneath: ephemeral compute · shared state · stale notes · default-deny egress · metered everything</text>
</svg>
